<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up — Kiln</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><a class="logo" href="index.html">Kiln</a><nav id="nav"></nav></header>
<main id="main">
<h1>Create an account</h1><form class="form" id="register-form"><div id="note"></div>
<label for="nm">Name</label><input id="nm" required autocomplete="name">
<label for="email">Email</label><input id="email" type="email" required autocomplete="email">
<label for="pw">Password (8+ characters)</label><input id="pw" type="password" minlength="8" required autocomplete="new-password"><br><br>
<button class="btn">Sign up</button></form>
</main>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
